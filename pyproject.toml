[project]
name = "aro-api"
version = "0.1.0"
description = "Aro backend and domain services"
requires-python = ">=3.12"
dependencies = ["boto3>=1.35,<2", "pydantic>=2.9,<3", "pydantic-settings>=2.6,<3"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "aws-cdk-lib>=2.180,<3",
    "constructs>=10.4,<11",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
exclude = ["^cdk\\.out/"]


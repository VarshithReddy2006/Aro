[project]
name = "parcelproof-api"
version = "0.1.0"
description = "ParcelProof backend and domain services"
requires-python = ">=3.12"
dependencies = ["boto3>=1.35,<2", "pydantic>=2.9,<3", "pydantic-settings>=2.6,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6", "ruff>=0.8,<1", "mypy>=1.13,<2"]
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
